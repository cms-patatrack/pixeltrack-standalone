; The same vector squared twice -- once in C++, once in Python with numpy --
; and the two results compared.
;
; Both squarers publish a std::vector<float>, and they are told apart only by
; the label of the module that produced them.  fwtest could not express this at
; all: its ProductRegistry keys products on the type alone and rejects the
; second producer of a type.
;
; Run with:  ./pytest src/pytest/square.ini --maxEvents 10
;
; Compare runs with tolerance = 0 and strict = true, so the job fails if the
; two implementations disagree by a single bit.

[options]
modules = randomGenerator, squareCxx, squarePy, compare, printer
esmodules = IntESProducer
numberOfThreads = 1
numberOfStreams = 0

[randomGenerator]
@type = RandomGenerator
count = 10000
seed = 12345

[squareCxx]
@type = SquareCxx
input = randomGenerator

[squarePy]
@type = PythonProducer
script = square
input = randomGenerator

[compare]
@type = Compare
lhs = squareCxx
rhs = squarePy
tolerance = 0
strict = true

[printer]
@type = Printer
input = compare
