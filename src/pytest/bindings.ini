; Every binding the generator emits, exercised and checked.
;
; CalibrateCxx and python/calibrate.py build the same Samples product from the
; same Floats and the same conditions -- one in C++, one through the generated
; bindings -- and SamplesCompare checks the two column by column with no
; tolerance.  python/calibrate_check.py then reads both back, which is the
; other half: calibrate.py only writes.
;
; What each one covers is listed at the top of python/calibrate.py.  The point
; of the file is that pyserial cannot be a test -- it needs the detector, its
; conditions and its raw data -- so the shapes of its products are reproduced
; here with arithmetic that C++ and numpy agree on bit for bit.
;
; Run with:  ./pytest src/pytest/bindings.ini --maxEvents 10

[options]
modules = randomGenerator, calibrateCxx, calibratePy, samplesCompare, calibrateCheck
esmodules = CalibrationESProducer
numberOfThreads = 1
numberOfStreams = 0

[randomGenerator]
@type = RandomGenerator
count = 1000
seed = 12345

; Neither calibrator names its input: one module publishes a Floats product, and
; an empty label means "the only product of that type".
[calibrateCxx]
@type = CalibrateCxx

[calibratePy]
@type = PythonProducer
script = calibrate

[samplesCompare]
@type = SamplesCompare
lhs = calibrateCxx
rhs = calibratePy
count = calibratePy

[calibrateCheck]
@type = PythonProducer
script = calibrate_check
lhs = calibrateCxx
rhs = calibratePy
summary = samplesCompare
