; The fwtest workflow, expressed as a configuration.
;
; [options] modules = ... is the schedule: each name is a *label*, and each
; label has a section of its own naming the plugin to instantiate as '@type'.
; Products are published under the producing module's label, so the same plugin
; can appear more than once under different labels -- which is what
; ProductRegistry's (type, label) key buys, and what the C++/Python comparison
; in square.ini relies on.
;
; Run with:  ./pytest src/pytest/test.ini
;
; The run-time options below are only defaults: --numberOfThreads and friends
; still override them, so run-scan.py keeps working.

[options]
modules = testProducer, testProducer3, testProducer2
esmodules = IntESProducer
numberOfThreads = 1
numberOfStreams = 0

[testProducer]
@type = TestProducer

[testProducer3]
@type = TestProducer3
input = testProducer

[testProducer2]
@type = TestProducer2
input = testProducer
