; Products built in Python from Python values, with Event.emplace().
;
; emplace() is the operation that constructs: it turns a list into a
; std::vector<float> and four numbers into a pytest::Comparison, and moves each
; into the Event.  allocate() would hand back empty storage to fill, and put()
; would copy a product that already exists -- neither can build one.
;
; The aggregate is checked by the C++ Printer, which consumes a Comparison and
; knows nothing about where it came from; the vector is checked in Python.
;
; Run with:  ./pytest src/pytest/emplace.ini --maxEvents 2

[options]
modules = maker, checker, printer

[maker]
@type = PythonProducer
script = emplace_demo

[checker]
@type = PythonProducer
script = emplace_check
input = maker

[printer]
@type = Printer
input = maker
