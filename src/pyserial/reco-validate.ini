; The all-C++ reconstruction of reco.ini, with the count validation scheduled.
;
; Same modules in the same order; [options] validation = true is what appends
; countValidator to the path, so this is what `reco.ini --validation` runs,
; written down rather than passed on the command line.
;
; Run with:  ./pyserial src/pyserial/reco-validate.ini --maxEvents 1000

[options]
modules = beamSpot, clusters, recHits, tracks, vertices
esmodules = BeamSpotESProducer, SiPixelFedCablingMapGPUWrapperESProducer, SiPixelGainCalibrationForHLTGPUESProducer, PixelCPEFastESProducer
validation = true

[beamSpot]
@type = BeamSpotToPOD

[clusters]
@type = SiPixelRawToClusterCUDA

[recHits]
@type = SiPixelRecHitCUDA

[tracks]
@type = CAHitNtupletCUDA

[vertices]
@type = PixelVertexProducerCUDA

[countValidator]
@type = CountValidator

; Appended by --histogram.
[histoValidator]
@type = HistoValidator
