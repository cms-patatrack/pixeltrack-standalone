; Both implementations of every ported module on the same events, and a module
; comparing each pair object by object.
;
; Four producers run twice -- the clusterizer, the beam spot, the rec hits and
; the vertices -- and each Python module is given exactly the same input as its
; C++ counterpart (recHitsPy reads the C++ clusters and the C++ beam spot,
; verticesPy the C++ tracks), so a difference can only come from the module
; being compared.  The rest of the chain runs once, on the C++ products.
;
; Two modules publishing the same product type in one job is what the (type,
; label) product key was added for, and why the C++ modules take an `input`
; label: with two beam spots in the Event, recHits has to say which it wants.
;
; The comparisons are exact: ClusterCompare checks seven columns over every
; digi and four over every module, BeamSpotCompare eleven floats, RecHitCompare
; thirteen columns over every hit, VertexCompare every vertex field.
;
; Run with:  ./pyserial src/pyserial/reco-compare.ini --maxEvents 100

[options]
modules = beamSpot, beamSpotPy, beamSpotCompare, clusters, clustersPy, clusterCompare, recHits, recHitsPy, recHitCompare, tracks, vertices, verticesPy, vertexCompare
esmodules = BeamSpotESProducer, SiPixelFedCablingMapGPUWrapperESProducer, SiPixelGainCalibrationForHLTGPUESProducer, PixelCPEFastESProducer

[beamSpot]
@type = BeamSpotToPOD

[beamSpotPy]
@type = PythonProducer
script = beam_spot

[beamSpotCompare]
@type = BeamSpotCompare
lhs = beamSpot
rhs = beamSpotPy

[clusters]
@type = SiPixelRawToClusterCUDA

[clustersPy]
@type = PythonProducer
script = pixel_clusters

[clusterCompare]
@type = ClusterCompare
lhs = clusters
rhs = clustersPy

[recHits]
@type = SiPixelRecHitCUDA
input = clusters
beamSpot = beamSpot

[recHitsPy]
@type = PythonProducer
script = pixel_rechits
input = clusters
beamSpot = beamSpot

[recHitCompare]
@type = RecHitCompare
lhs = recHits
rhs = recHitsPy

[tracks]
@type = CAHitNtupletCUDA
input = recHits

[vertices]
@type = PixelVertexProducerCUDA
input = tracks

[verticesPy]
@type = PythonProducer
script = vertex_finder
input = tracks

[vertexCompare]
@type = VertexCompare
lhs = vertices
rhs = verticesPy
