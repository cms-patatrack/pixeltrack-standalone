; Both vertex finders on the same tracks, and a module comparing them object by
; object.
;
; Two modules publishing the same product type in one job is what the (type,
; label) product key was added for: vertices and verticesPy are told apart only
; by the label of the module that produced them, and vertexCompare names both.
;
; The comparison is exact: every vertex field, on every event.
;
; Run with:  ./pyserial src/pyserial/reco-compare.ini --maxEvents 100

[options]
modules = beamSpot, clusters, recHits, tracks, vertices, verticesPy, vertexCompare
esmodules = BeamSpotESProducer, SiPixelFedCablingMapGPUWrapperESProducer, SiPixelGainCalibrationForHLTGPUESProducer, PixelCPEFastESProducer

[beamSpot]
@type = BeamSpotToPOD

[clusters]
@type = SiPixelRawToClusterCUDA

[recHits]
@type = SiPixelRecHitCUDA

[tracks]
@type = CAHitNtupletCUDA

[vertices]
@type = PixelVertexProducerCUDA
input = tracks

[verticesPy]
@type = PythonProducer
script = vertex_finder
input = tracks

[vertexCompare]
@type = VertexCompare
lhs = vertices
rhs = verticesPy
