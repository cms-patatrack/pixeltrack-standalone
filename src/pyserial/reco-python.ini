; The same reconstruction as reco.ini, with the vertex finder in Python.
;
; Only the [vertices] section differs: PixelVertexProducerCUDA is replaced by
; PythonProducer running python/vertex_finder.py.  Everything upstream, the
; source and the validation are identical, so a throughput difference against
; reco.ini is the vertex module and nothing else.
;
; Run with:  ./pyserial src/pyserial/reco-python.ini --numberOfStreams 16 --numberOfThreads 16

[options]
modules = beamSpot, clusters, recHits, tracks, vertices
esmodules = BeamSpotESProducer, SiPixelFedCablingMapGPUWrapperESProducer, SiPixelGainCalibrationForHLTGPUESProducer, PixelCPEFastESProducer

[beamSpot]
@type = BeamSpotToPOD

[clusters]
@type = SiPixelRawToClusterCUDA

[recHits]
@type = SiPixelRecHitCUDA

[tracks]
@type = CAHitNtupletCUDA

[vertices]
@type = PythonProducer
script = vertex_finder

; Appended by --validation / --histogram.
[countValidator]
@type = CountValidator

[histoValidator]
@type = HistoValidator
