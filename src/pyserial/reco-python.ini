; The same reconstruction as reco.ini, with the beam spot and the vertex finder
; in Python.
;
; The beam spot module computes nothing -- it moves eleven floats from the
; EventSetup into the Event -- so what it adds over the vertex finder alone is
; very nearly the fixed cost of entering Python once more per event, with no
; payload and no work.
;
; Run with:  ./pyserial src/pyserial/reco-python.ini --numberOfStreams 16 --numberOfThreads 16

[options]
modules = beamSpot, clusters, recHits, tracks, vertices
esmodules = BeamSpotESProducer, SiPixelFedCablingMapGPUWrapperESProducer, SiPixelGainCalibrationForHLTGPUESProducer, PixelCPEFastESProducer

[beamSpot]
@type = PythonProducer
script = beam_spot

[clusters]
@type = SiPixelRawToClusterCUDA

[recHits]
@type = SiPixelRecHitCUDA

[tracks]
@type = CAHitNtupletCUDA

[vertices]
@type = PythonProducer
script = vertex_finder

; Appended by --validation / --histogram.
[countValidator]
@type = CountValidator

[histoValidator]
@type = HistoValidator
