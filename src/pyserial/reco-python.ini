; The same reconstruction as reco.ini with every module that has been ported to
; Python running in Python: the beam spot, the pixel local reconstruction and
; the vertex finding.
;
; Only the clusterizer and the track finder are still C++ -- the first is a
; connected-components algorithm and the second a graph walk, neither of which
; numpy is the right tool for.  Everything upstream, the source and the
; validation are identical to reco.ini, so a throughput difference against it
; is the three Python modules and nothing else.
;
; Run with:  ./pyserial src/pyserial/reco-python.ini --numberOfStreams 16 --numberOfThreads 16

[options]
modules = beamSpot, clusters, recHits, tracks, vertices
esmodules = BeamSpotESProducer, SiPixelFedCablingMapGPUWrapperESProducer, SiPixelGainCalibrationForHLTGPUESProducer, PixelCPEFastESProducer

[beamSpot]
@type = PythonProducer
script = beam_spot

[clusters]
@type = SiPixelRawToClusterCUDA

[recHits]
@type = PythonProducer
script = pixel_rechits

[tracks]
@type = CAHitNtupletCUDA

[vertices]
@type = PythonProducer
script = vertex_finder

; Appended by --validation / --histogram.
[countValidator]
@type = CountValidator

[histoValidator]
@type = HistoValidator
