; The same reconstruction as reco.ini with every module that has been ported to
; Python running in Python: the clusterizer, the beam spot, the pixel local
; reconstruction and the vertex finding.
;
; Only the track finder is still C++.  Everything upstream, the source and the
; validation are identical to reco.ini, so a throughput difference against it
; is the four Python modules and nothing else.
;
; Run with:  ./pyserial src/pyserial/reco-python.ini --numberOfStreams 16 --numberOfThreads 16

[options]
modules = beamSpot, clusters, recHits, tracks, vertices
esmodules = BeamSpotESProducer, SiPixelFedCablingMapGPUWrapperESProducer, SiPixelGainCalibrationForHLTGPUESProducer, PixelCPEFastESProducer

[beamSpot]
@type = PythonProducer
script = beam_spot

[clusters]
@type = PythonProducer
script = pixel_clusters

[recHits]
@type = PythonProducer
script = pixel_rechits

[tracks]
@type = CAHitNtupletCUDA

[vertices]
@type = PythonProducer
script = vertex_finder

; Appended by --validation / --histogram.
[countValidator]
@type = CountValidator

[histoValidator]
@type = HistoValidator
