; The mixed C++ / Python reconstruction of reco-python.ini, with the count
; validation scheduled.
;
; The counts it checks are the ones reco-validate.ini checks, on the same
; events -- and with the clusterizer in Python they start at the raw data: the
; digi, cluster, track and vertex counts all have to come out of the Python
; chain unchanged, not merely be produced.
;
; Run with:  ./pyserial src/pyserial/reco-python-validate.ini --maxEvents 1000

[options]
modules = beamSpot, clusters, recHits, tracks, vertices
esmodules = BeamSpotESProducer, SiPixelFedCablingMapGPUWrapperESProducer, SiPixelGainCalibrationForHLTGPUESProducer, PixelCPEFastESProducer
validation = true

[beamSpot]
@type = PythonProducer
script = beam_spot

[clusters]
@type = PythonProducer
script = pixel_clusters

[recHits]
@type = PythonProducer
script = pixel_rechits

[tracks]
@type = CAHitNtupletCUDA

[vertices]
@type = PythonProducer
script = vertex_finder

; The validation is a Python module too: the label is the one --validation
; appends, so the flag and `validation = true` both reach this one.
[countValidator]
@type = PythonProducer
script = count_validator

; Appended by --histogram.
[histoValidator]
@type = HistoValidator
