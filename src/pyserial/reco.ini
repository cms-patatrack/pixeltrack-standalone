; The pixel reconstruction, all in C++.  This is the control every Python
; measurement is made against: same source, same schedule, same modules.
;
; The validators have a section but are not scheduled, so that --validation and
; --histogram can still append them; reco-validate.ini is the same job with the
; count validation always on.
;
; Run with:  ./pyserial src/pyserial/reco.ini --numberOfStreams 16 --numberOfThreads 16

[options]
modules = beamSpot, clusters, recHits, tracks, vertices
esmodules = BeamSpotESProducer, SiPixelFedCablingMapGPUWrapperESProducer, SiPixelGainCalibrationForHLTGPUESProducer, PixelCPEFastESProducer

[beamSpot]
@type = BeamSpotToPOD

[clusters]
@type = SiPixelRawToClusterCUDA

[recHits]
@type = SiPixelRecHitCUDA

[tracks]
@type = CAHitNtupletCUDA

[vertices]
@type = PixelVertexProducerCUDA

; Appended by --validation / --histogram.
[countValidator]
@type = CountValidator

[histoValidator]
@type = HistoValidator
